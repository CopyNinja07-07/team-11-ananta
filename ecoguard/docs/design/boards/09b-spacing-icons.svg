<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">STYLE GUIDE, PART 2</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">Spacing, radius and icons</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><text x="64" y="188" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">SPACING · 4 PX BASE</text><rect x="64" y="210" width="16" height="24" rx="3" fill="#B5D8BF"/><text x="94" y="227" font-family="JetBrains Mono" font-size="13" fill="#34463E">4 px</text><rect x="64" y="254" width="32" height="24" rx="3" fill="#B5D8BF"/><text x="110" y="271" font-family="JetBrains Mono" font-size="13" fill="#34463E">8 px</text><rect x="64" y="298" width="48" height="24" rx="3" fill="#B5D8BF"/><text x="126" y="315" font-family="JetBrains Mono" font-size="13" fill="#34463E">12 px</text><rect x="64" y="342" width="64" height="24" rx="3" fill="#B5D8BF"/><text x="142" y="359" font-family="JetBrains Mono" font-size="13" fill="#34463E">16 px</text><rect x="64" y="386" width="96" height="24" rx="3" fill="#B5D8BF"/><text x="174" y="403" font-family="JetBrains Mono" font-size="13" fill="#34463E">24 px</text><rect x="64" y="430" width="128" height="24" rx="3" fill="#B5D8BF"/><text x="206" y="447" font-family="JetBrains Mono" font-size="13" fill="#34463E">32 px</text><rect x="64" y="474" width="192" height="24" rx="3" fill="#B5D8BF"/><text x="270" y="491" font-family="JetBrains Mono" font-size="13" fill="#34463E">48 px</text><rect x="64" y="518" width="256" height="24" rx="3" fill="#B5D8BF"/><text x="334" y="535" font-family="JetBrains Mono" font-size="13" fill="#34463E">64 px</text><text x="64" y="600" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">Cards use 16 inside and 20 between. Screen edges 24 on desktop, 16 on</text><text x="64" y="621" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">phone. Touch targets never below 44.</text><text x="720" y="188" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">RADIUS</text><rect x="720" y="210" width="160" height="100" rx="4" fill="#FFFFFF" stroke="#C9CFC7" stroke-width="1.5"/><text x="800" y="266" font-family="JetBrains Mono" font-size="13" fill="#34463E" text-anchor="middle">pill 6</text><rect x="920" y="210" width="160" height="100" rx="10" fill="#FFFFFF" stroke="#C9CFC7" stroke-width="1.5"/><text x="1000" y="266" font-family="JetBrains Mono" font-size="13" fill="#34463E" text-anchor="middle">button 10</text><rect x="1120" y="210" width="160" height="100" rx="16" fill="#FFFFFF" stroke="#C9CFC7" stroke-width="1.5"/><text x="1200" y="266" font-family="JetBrains Mono" font-size="13" fill="#34463E" text-anchor="middle">card 16</text><rect x="1320" y="210" width="160" height="100" rx="24" fill="#FFFFFF" stroke="#C9CFC7" stroke-width="1.5"/><text x="1400" y="266" font-family="JetBrains Mono" font-size="13" fill="#34463E" text-anchor="middle">start node 24</text><text x="720" y="380" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">ICONS · LUCIDE, 1.75 STROKE, 16 / 20 PX</text><rect x="720" y="410" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(782,432) scale(1.5)" fill="none" stroke="#C98A00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="800" y="504" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Power</text><rect x="920" y="410" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(982,432) scale(1.5)" fill="none" stroke="#1C8DB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s-6 6.5-6 11a6 6 0 0 0 12 0c0-4.5-6-11-6-11z"/></g><text x="1000" y="504" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Water</text><rect x="1120" y="410" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(1182,432) scale(1.5)" fill="none" stroke="#B4532A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-8z"/></g><text x="1200" y="504" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Walls</text><rect x="1320" y="410" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(1382,432) scale(1.5)" fill="none" stroke="#C0392B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="1400" y="504" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Alert</text><rect x="720" y="540" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(782,562) scale(1.5)" fill="none" stroke="#34463E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h2M14 7h2M8 11h2M14 11h2"/></g><text x="800" y="634" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Room</text><rect x="920" y="540" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(982,562) scale(1.5)" fill="none" stroke="#0F5F7C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v8H4zM7 16v4M12 16v5M17 16v4"/></g><text x="1000" y="634" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Cooling</text><rect x="1120" y="540" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(1182,562) scale(1.5)" fill="none" stroke="#2F7549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></g><text x="1200" y="634" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Savings</text><rect x="1320" y="540" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><g transform="translate(1382,562) scale(1.5)" fill="none" stroke="#2F7549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="M5 19l8-8"/></g><text x="1400" y="634" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#34463E" text-anchor="middle">Leaf</text><text x="720" y="700" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">One icon set everywhere. The icon colour follows the resource, so a bolt is always amber and a</text><text x="720" y="721" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">drop is always blue.</text></svg>