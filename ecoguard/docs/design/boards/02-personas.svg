<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">PERSONAS</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">Four people, four different questions</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><rect x="64" y="173" width="350" height="770" rx="16" fill="#DEE2DA" opacity="0.6"/><rect x="64" y="170" width="350" height="770" rx="16" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><rect x="64" y="170" width="350" height="8" rx="4" fill="#2F7549"/><rect x="88" y="204" width="64" height="64" rx="32" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.5"/><text x="120" y="245" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#2F7549" text-anchor="middle">R</text><text x="168" y="228" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#10231C">Estate officer</text><text x="168" y="254" font-family="JetBrains Mono" font-size="14" fill="#66756D">Rakesh, 46</text><text x="88" y="310" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Looks after power, water and repairs</text><text x="88" y="331.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">for the whole block. Pays the bill</text><text x="88" y="353.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">but cannot see where it goes.</text><text x="88" y="401.2" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">WANTS</text><rect x="88" y="421.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="104" y="429.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Know which room is wasting, right now</text><rect x="88" y="460.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="104" y="468.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Show the principal what was saved</text><text x="88" y="515.3" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#C0392B" letter-spacing="1.5">FRUSTRATED BY</text><rect x="88" y="535.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="104" y="543.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">One bill, no sub-meters</text><rect x="88" y="574.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="104" y="582.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Finds leaks only when the wall shows</text><text x="104" y="603.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">a stain</text><rect x="88" y="820" width="302" height="92" rx="10" fill="#F4F2EC" stroke="#DEE2DA" stroke-width="1.5"/><text x="104" y="848" font-family="JetBrains Mono" font-size="11.5" font-weight="500" fill="#66756D" letter-spacing="1.5">USES ECOGUARD ON</text><text x="104" y="874" font-family="Space Grotesk" font-size="15" font-weight="500" fill="#10231C">Desktop in the office, phone on</text><text x="104" y="895.7" font-family="Space Grotesk" font-size="15" font-weight="500" fill="#10231C">rounds</text><rect x="438" y="173" width="350" height="770" rx="16" fill="#DEE2DA" opacity="0.6"/><rect x="438" y="170" width="350" height="770" rx="16" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><rect x="438" y="170" width="350" height="8" rx="4" fill="#865A00"/><rect x="462" y="204" width="64" height="64" rx="32" fill="#FBF4DF" stroke="#865A00" stroke-width="1.5"/><text x="494" y="245" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#865A00" text-anchor="middle">B</text><text x="542" y="228" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#10231C">Caretaker</text><text x="542" y="254" font-family="JetBrains Mono" font-size="14" fill="#66756D">Bashir, 38</text><text x="462" y="310" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Opens and locks rooms, switches the</text><text x="462" y="331.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">pump, fixes small faults. Reads Hindi</text><text x="462" y="353.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">faster than English.</text><text x="462" y="401.2" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">WANTS</text><rect x="462" y="421.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="478" y="429.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">A short instruction he can act on</text><rect x="462" y="460.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="478" y="468.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Not be blamed for every high bill</text><text x="462" y="515.3" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#C0392B" letter-spacing="1.5">FRUSTRATED BY</text><rect x="462" y="535.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="478" y="543.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Long reports in English</text><rect x="462" y="574.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="478" y="582.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Alerts that turn out to be wrong</text><rect x="462" y="820" width="302" height="92" rx="10" fill="#F4F2EC" stroke="#DEE2DA" stroke-width="1.5"/><text x="478" y="848" font-family="JetBrains Mono" font-size="11.5" font-weight="500" fill="#66756D" letter-spacing="1.5">USES ECOGUARD ON</text><text x="478" y="874" font-family="Space Grotesk" font-size="15" font-weight="500" fill="#10231C">Phone only, voice and Hindi</text><rect x="812" y="173" width="350" height="770" rx="16" fill="#DEE2DA" opacity="0.6"/><rect x="812" y="170" width="350" height="770" rx="16" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><rect x="812" y="170" width="350" height="8" rx="4" fill="#0F5F7C"/><rect x="836" y="204" width="64" height="64" rx="32" fill="#E8F3F7" stroke="#0F5F7C" stroke-width="1.5"/><text x="868" y="245" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#0F5F7C" text-anchor="middle">N</text><text x="916" y="228" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#10231C">Lab in-charge</text><text x="916" y="254" font-family="JetBrains Mono" font-size="14" fill="#66756D">Neha, 31</text><text x="836" y="310" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Runs the computer lab. Forty PCs and</text><text x="836" y="331.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">three ACs that students leave on</text><text x="836" y="353.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">after the last class.</text><text x="836" y="401.2" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">WANTS</text><rect x="836" y="421.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="852" y="429.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Find out who left what on</text><rect x="836" y="460.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="852" y="468.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Keep the lab cool without wasting</text><text x="836" y="515.3" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#C0392B" letter-spacing="1.5">FRUSTRATED BY</text><rect x="836" y="535.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="852" y="543.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">No idea what the lab costs</text><rect x="836" y="574.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="852" y="582.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">PCs left on overnight</text><rect x="836" y="820" width="302" height="92" rx="10" fill="#F4F2EC" stroke="#DEE2DA" stroke-width="1.5"/><text x="852" y="848" font-family="JetBrains Mono" font-size="11.5" font-weight="500" fill="#66756D" letter-spacing="1.5">USES ECOGUARD ON</text><text x="852" y="874" font-family="Space Grotesk" font-size="15" font-weight="500" fill="#10231C">Laptop, checks once a day</text><rect x="1186" y="173" width="350" height="770" rx="16" fill="#DEE2DA" opacity="0.6"/><rect x="1186" y="170" width="350" height="770" rx="16" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><rect x="1186" y="170" width="350" height="8" rx="4" fill="#7A341A"/><rect x="1210" y="204" width="64" height="64" rx="32" fill="#F8ECE5" stroke="#7A341A" stroke-width="1.5"/><text x="1242" y="245" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#7A341A" text-anchor="middle">D</text><text x="1290" y="228" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#10231C">Principal / finance</text><text x="1290" y="254" font-family="JetBrains Mono" font-size="14" fill="#66756D">Dr. Kaul, 55</text><text x="1210" y="310" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Signs the bills and the budget. Wants</text><text x="1210" y="331.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">proof, in rupees and carbon, before</text><text x="1210" y="353.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">spending on hardware.</text><text x="1210" y="401.2" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">WANTS</text><rect x="1210" y="421.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="1226" y="429.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Monthly saving in rupees</text><rect x="1210" y="460.2" width="6" height="6" rx="3" fill="#2F7549"/><text x="1226" y="468.2" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Carbon numbers for the campus report</text><text x="1210" y="515.3" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#C0392B" letter-spacing="1.5">FRUSTRATED BY</text><rect x="1210" y="535.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="1226" y="543.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Pilots that never show results</text><rect x="1210" y="574.3" width="6" height="6" rx="3" fill="#C0392B"/><text x="1226" y="582.3" font-family="IBM Plex Sans" font-size="14.5" fill="#10231C">Dashboards full of charts</text><rect x="1210" y="820" width="302" height="92" rx="10" fill="#F4F2EC" stroke="#DEE2DA" stroke-width="1.5"/><text x="1226" y="848" font-family="JetBrains Mono" font-size="11.5" font-weight="500" fill="#66756D" letter-spacing="1.5">USES ECOGUARD ON</text><text x="1226" y="874" font-family="Space Grotesk" font-size="15" font-weight="500" fill="#10231C">Monthly PDF and a phone glance</text></svg>