<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">USER FLOW 2 · THE GAP NO METER SHOWS</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">Heat and damp inside the walls</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><rect x="64" y="170" width="1472" height="300" rx="14" fill="#FBF4DF" stroke="#C98A00" stroke-width="1.2"/><text x="88" y="206" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#C98A00" letter-spacing="1.5">POWER SIDE</text><rect x="64" y="500" width="1472" height="300" rx="14" fill="#E8F3F7" stroke="#1C8DB5" stroke-width="1.2"/><text x="88" y="536" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#1C8DB5" letter-spacing="1.5">WATER SIDE</text><rect x="110" y="240" width="240" height="110" rx="10" fill="#FBF4DF" stroke="#C98A00" stroke-width="1.8"/><text x="230" y="273" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Board meter vs room</text><text x="230" y="292" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">meters</text><text x="230" y="312" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">sum of rooms is lower than the</text><text x="230" y="329" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">board</text><rect x="400" y="240" width="240" height="110" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="520" y="281.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Gap grows with the square</text><text x="520" y="300.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">of current</text><text x="520" y="320.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">I²R, worst at peak AC load</text><rect x="690" y="240" width="240" height="110" rx="10" fill="#F8ECE5" stroke="#B4532A" stroke-width="1.8"/><text x="810" y="281.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Hot, loose joint</text><text x="810" y="300.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">suspected</text><text x="810" y="320.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">wall and floor named</text><rect x="980" y="240" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#2F7549" stroke-width="1.8"/><text x="1100" y="281.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Electrician checks that</text><text x="1100" y="300.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">joint</text><text x="1100" y="320.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">thermal gun, before it burns</text><rect x="1270" y="240" width="240" height="110" rx="24" fill="#0F2A20" stroke="#0F2A20" stroke-width="1.8"/><text x="1390" y="291" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Loss falls back</text><text x="1390" y="311" font-family="IBM Plex Sans" font-size="12.5" fill="#C9CFC7" text-anchor="middle">gap returns to normal</text><path d="M350,295 L396,295" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M640,295 L686,295" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M930,295 L976,295" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M1220,295 L1266,295" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="110" y="570" width="240" height="110" rx="10" fill="#E8F3F7" stroke="#1C8DB5" stroke-width="1.8"/><text x="230" y="621" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Pump on, tank not rising</text><text x="230" y="641" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">or tank rising with taps closed</text><rect x="400" y="570" width="240" height="110" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="520" y="612.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Night flow above zero</text><text x="520" y="632.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">no one inside, water still</text><text x="520" y="649.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">moving</text><rect x="690" y="570" width="240" height="110" rx="10" fill="#F8ECE5" stroke="#B4532A" stroke-width="1.8"/><text x="810" y="621" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Hidden leak suspected</text><text x="810" y="641" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">earth-leakage on that wall rises</text><rect x="980" y="570" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#2F7549" stroke-width="1.8"/><text x="1100" y="621" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Plumber opens that wall</text><text x="1100" y="641" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">one place, not the whole floor</text><rect x="1270" y="570" width="240" height="110" rx="24" fill="#0F2A20" stroke="#0F2A20" stroke-width="1.8"/><text x="1390" y="621" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Night flow back to zero</text><text x="1390" y="641" font-family="IBM Plex Sans" font-size="12.5" fill="#C9CFC7" text-anchor="middle">litres saved are counted</text><path d="M350,625 L396,625" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M640,625 L686,625" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M930,625 L976,625" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M1220,625 L1266,625" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="64" y="880" width="1472" height="70" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="88" y="921" font-family="IBM Plex Sans" font-size="15" fill="#34463E">The walls page shows both on one section drawing of the block, so the estate officer sees which wall to open before anything is broken.</text></svg>