<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">DATA FLOW DIAGRAM</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">Data flow, level 1: inside ECOGUARD</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><rect x="90" y="200" width="330" height="120" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="255" y="256" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">1.0 Ingest and count</text><text x="255" y="276" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">check readings, count people (YOLO)</text><rect x="90" y="520" width="330" height="120" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="255" y="576" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">2.0 Detect waste</text><text x="255" y="596" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">room model + 9 checks</text><rect x="620" y="200" width="330" height="120" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="785" y="256" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">3.0 Cost and carbon</text><text x="785" y="276" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">₹ per kWh and per kL, 0.716 kg CO₂/kWh</text><rect x="620" y="520" width="330" height="120" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="785" y="576" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">4.0 Explain</text><text x="785" y="596" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">sentence templates, EN or हिं</text><rect x="1150" y="360" width="330" height="120" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="1315" y="416" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">5.0 Learn from feedback</text><text x="1315" y="436" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Yes / No becomes a label</text><rect x="90" y="380" width="330" height="54" rx="0" fill="#E8F3F7"/><path d="M420,380 H90 V434 H420" stroke="#0F5F7C" stroke-width="1.8" fill="none"/><path d="M134,380 L134,434" stroke="#0F5F7C" stroke-width="1.2" fill="none"/><text x="112" y="412" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#0F5F7C" text-anchor="middle">D1</text><text x="146" y="412" font-family="IBM Plex Sans" font-size="14" font-weight="500" fill="#10231C">Readings</text><rect x="620" y="380" width="330" height="54" rx="0" fill="#E8F3F7"/><path d="M950,380 H620 V434 H950" stroke="#0F5F7C" stroke-width="1.8" fill="none"/><path d="M664,380 L664,434" stroke="#0F5F7C" stroke-width="1.2" fill="none"/><text x="642" y="412" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#0F5F7C" text-anchor="middle">D2</text><text x="676" y="412" font-family="IBM Plex Sans" font-size="14" font-weight="500" fill="#10231C">Alerts</text><rect x="1150" y="600" width="330" height="54" rx="0" fill="#E8F3F7"/><path d="M1480,600 H1150 V654 H1480" stroke="#0F5F7C" stroke-width="1.8" fill="none"/><path d="M1194,600 L1194,654" stroke="#0F5F7C" stroke-width="1.2" fill="none"/><text x="1172" y="632" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#0F5F7C" text-anchor="middle">D3</text><text x="1206" y="632" font-family="IBM Plex Sans" font-size="14" font-weight="500" fill="#10231C">Labels</text><rect x="1150" y="200" width="330" height="54" rx="0" fill="#E8F3F7"/><path d="M1480,200 H1150 V254 H1480" stroke="#0F5F7C" stroke-width="1.8" fill="none"/><path d="M1194,200 L1194,254" stroke="#0F5F7C" stroke-width="1.2" fill="none"/><text x="1172" y="232" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#0F5F7C" text-anchor="middle">D4</text><text x="1206" y="232" font-family="IBM Plex Sans" font-size="14" font-weight="500" fill="#10231C">Building config</text><rect x="620" y="700" width="330" height="54" rx="0" fill="#E8F3F7"/><path d="M950,700 H620 V754 H950" stroke="#0F5F7C" stroke-width="1.8" fill="none"/><path d="M664,700 L664,754" stroke="#0F5F7C" stroke-width="1.2" fill="none"/><text x="642" y="732" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#0F5F7C" text-anchor="middle">D5</text><text x="676" y="732" font-family="IBM Plex Sans" font-size="14" font-weight="500" fill="#10231C">Trained models</text><path d="M255,320 L255,376" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="269.5" y="339" width="81" height="19" rx="4" fill="#F4F2EC"/><text x="310" y="353" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">clean rows</text><path d="M255,434 L255,516" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="283.3" y="465" width="53.4" height="19" rx="4" fill="#F4F2EC"/><text x="310" y="479" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">window</text><path d="M420,580 C520,580 520,260 616,260" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="458.8" y="407" width="122.3" height="19" rx="4" fill="#F4F2EC"/><text x="520" y="421" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">fault, room, kWh</text><path d="M785,320 L785,376" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="802.9" y="339" width="74.1" height="19" rx="4" fill="#F4F2EC"/><text x="840" y="353" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">alert + ₹</text><path d="M785,434 L785,516" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="799.5" y="465" width="81" height="19" rx="4" fill="#F4F2EC"/><text x="840" y="479" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">facts only</text><path d="M950,580 C1050,580 1050,420 1146,420" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="1029.8" y="532" width="60.3" height="19" rx="4" fill="#F4F2EC"/><text x="1060" y="546" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">to user</text><path d="M1315,480 L1315,596" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="1351.7" y="527" width="46.5" height="19" rx="4" fill="#F4F2EC"/><text x="1375" y="541" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">label</text><path d="M1150,627 C700,700 300,700 255,644" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="597.4" y="677" width="205.2" height="19" rx="4" fill="#F4F2EC"/><text x="700" y="691" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">stricter thresholds per room</text><path d="M1150,207 C800,160 300,160 255,196" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="590.5" y="155" width="219" height="19" rx="4" fill="#F4F2EC"/><text x="700" y="169" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">floors, rooms, AC, PCs, tariff</text><path d="M616,727 C480,727 440,700 420,620" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="425" y="747" width="150" height="19" rx="4" fill="#F4F2EC"/><text x="500" y="761" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">expected kW per room</text><rect x="90" y="820" width="1390" height="110" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="114" y="856" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Numbers are always computed in code (2.0 and 3.0); 4.0 only fills them into fixed English and Hindi sentences, so advice can never invent a number. D5 holds the trained</text><text x="114" y="877.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">room models; Yes / No labels in D3 are used to retrain them. D4 is a single JSON file, so a new building is a config edit, not new code.</text></svg>