<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">WHY THE DESIGN LOOKS THE WAY IT DOES</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">From every building to one block we can prove</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><rect x="170" y="180" width="900" height="96" rx="12" fill="#C9CFC7"/><text x="620" y="236" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#10231C" text-anchor="middle">Every building, every kind of waste</text><text x="1120" y="210" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">ROUND 1</text><text x="1120" y="236" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Homes, hostels, hospitals and offices with every</text><text x="1120" y="257.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">sensor we could name. Too broad to prove.</text><rect x="251" y="330" width="738" height="96" rx="12" fill="#B5D8BF"/><text x="620" y="386" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#10231C" text-anchor="middle">Campus buildings in Jammu</text><text x="1120" y="360" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">CHOICE 1</text><text x="1120" y="386" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Fixed timetables, rooms empty for hours, one bill</text><text x="1120" y="407.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">for the block, no sub-meters.</text><rect x="332" y="480" width="576" height="96" rx="12" fill="#8EC29F"/><text x="620" y="536" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#10231C" text-anchor="middle">One academic block</text><text x="1120" y="510" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">CHOICE 2</text><text x="1120" y="536" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Three floors, eight rooms, washrooms, a sump, a pump</text><text x="1120" y="557.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">and a roof tank.</text><rect x="413" y="630" width="414" height="96" rx="12" fill="#3E8E5A"/><text x="620" y="686" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Twelve connected wastes</text><text x="1120" y="660" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">CHOICE 3</text><text x="1120" y="686" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Power, water and the walls, each traced to the room,</text><text x="1120" y="707.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">the cause, the cost and the fix.</text><rect x="399.6" y="780" width="440.8" height="96" rx="12" fill="#245C3A"/><text x="620" y="836" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">A full year and 659 real buildings</text><text x="1120" y="810" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#2F7549" letter-spacing="1.5">PROOF</text><text x="1120" y="836" font-family="IBM Plex Sans" font-size="15" fill="#34463E">35,040 simulated readings with 558 faults, and real</text><text x="1120" y="857.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">meters from the open BDG2 data set.</text></svg>