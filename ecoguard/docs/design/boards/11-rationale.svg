<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">DESIGN RATIONALE</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">Why the design looks the way it does</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><rect x="64" y="170" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="88" y="210" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">01</text><text x="128" y="210" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">Narrowed to one block</text><text x="88" y="250" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Round 1 covered every building and lost marks for</text><text x="88" y="271.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">it. One academic block lets us show every waste</text><text x="88" y="293.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">inside it, end to end, with numbers we can defend.</text><rect x="560" y="170" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="584" y="210" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">02</text><text x="624" y="210" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">The building is the home screen</text><text x="584" y="250" font-family="IBM Plex Sans" font-size="15" fill="#34463E">A facility manager thinks in rooms and floors, not</text><text x="584" y="271.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">in charts. The 3D view and plan answer &#x27;where&#x27;</text><text x="584" y="293.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">before &#x27;how much&#x27;.</text><rect x="1056" y="170" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="1080" y="210" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">03</text><text x="1120" y="210" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">Colour means a resource</text><text x="1080" y="250" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Amber is power, blue is water, ember is the walls.</text><text x="1080" y="271.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Users learn it once and read every screen faster.</text><text x="1080" y="293.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Red is kept for &#x27;act now&#x27;.</text><rect x="64" y="430" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="88" y="470" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">04</text><text x="128" y="470" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">One alert, one room, one fix</text><text x="88" y="510" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Each alert names the room, the cause, the rupees per</text><text x="88" y="531.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">hour and the action. The caretaker can act without</text><text x="88" y="553.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">opening anything else.</text><rect x="560" y="430" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="584" y="470" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">05</text><text x="624" y="470" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">Yes / No on every alert</text><text x="584" y="510" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Two taps teach the system. Wrong alerts get rarer</text><text x="584" y="531.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">for that room, and the campus builds its own</text><text x="584" y="553.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">labelled data.</text><rect x="1056" y="430" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="1080" y="470" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">06</text><text x="1120" y="470" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">Hindi and voice</text><text x="1080" y="510" font-family="IBM Plex Sans" font-size="15" fill="#34463E">The caretaker is the person who switches things off.</text><text x="1080" y="531.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">He gets the fix read aloud in Hindi on his phone.</text><rect x="64" y="690" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="88" y="730" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">07</text><text x="128" y="730" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">Numbers in code, words from templates</text><text x="88" y="770" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Rupees, kWh and CO2 are computed by fixed formulas</text><text x="88" y="791.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">and dropped into fixed English and Hindi sentences,</text><text x="88" y="813.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">so the advice can never invent a number.</text><rect x="560" y="690" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="584" y="730" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">08</text><text x="624" y="730" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">Real and simulated side by side</text><text x="584" y="770" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Every page says where its numbers come from: the</text><text x="584" y="791.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">simulated Jammu block or the 659 real BDG2</text><text x="584" y="813.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">buildings.</text><rect x="1056" y="690" width="470" height="236" rx="14" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="1080" y="730" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549">09</text><text x="1120" y="730" font-family="Space Grotesk" font-size="19" font-weight="600" fill="#10231C">Tools</text><text x="1080" y="770" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Figma for the design file, components and prototype.</text><text x="1080" y="791.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Colour, spacing and type are named tokens, so the</text><text x="1080" y="813.5" font-family="IBM Plex Sans" font-size="15" fill="#34463E">build can match the file exactly.</text></svg>