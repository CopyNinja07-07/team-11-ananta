<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">USER FLOW 1 · CARETAKER AND ESTATE OFFICER</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">A wasted room, from reading to fixed</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><rect x="64" y="300" width="200" height="110" rx="4" fill="#FFFFFF" stroke="#34463E" stroke-width="1.8"/><text x="164" y="342.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Reading arrives</text><text x="164" y="362.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">every 15 min: power,</text><text x="164" y="379.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">people, water</text><rect x="318" y="300" width="200" height="110" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="418" y="333" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Check against the</text><text x="418" y="352" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">timetable</text><text x="418" y="372" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">room empty but drawing</text><text x="418" y="389" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">power?</text><rect x="572" y="300" width="200" height="110" rx="10" fill="#FBF4DF" stroke="#C98A00" stroke-width="1.8"/><text x="672" y="342.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Alert with a name</text><text x="672" y="362.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">room, cause, ₹ per hour,</text><text x="672" y="379.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">fix</text><rect x="826" y="300" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#2F7549" stroke-width="1.8"/><text x="926" y="351" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Caretaker hears it</text><text x="926" y="371" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">phone, Hindi voice</text><rect x="1080" y="300" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#2F7549" stroke-width="1.8"/><text x="1180" y="351" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Switches it off</text><text x="1180" y="371" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">on his round</text><rect x="1334" y="300" width="200" height="110" rx="24" fill="#0F2A20" stroke="#0F2A20" stroke-width="1.8"/><text x="1434" y="351" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Right call?</text><text x="1434" y="371" font-family="IBM Plex Sans" font-size="12.5" fill="#C9CFC7" text-anchor="middle">Yes / No</text><path d="M264,355 L314,355" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M518,355 L568,355" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M772,355 L822,355" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M1026,355 L1076,355" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M1280,355 L1330,355" stroke="#66756D" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M1434,410 V520 H1180" stroke="#2F7549" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="1293.6" y="499" width="32.7" height="19" rx="4" fill="#F4F2EC"/><text x="1310" y="513" font-family="JetBrains Mono" font-size="11.5" fill="#2F7549" text-anchor="middle">yes</text><rect x="940" y="480" width="236" height="90" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="1058" y="521" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Saving is counted</text><text x="1058" y="541" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">kWh, ₹ and CO₂ go to Savings</text><path d="M1434,410 V640 H1180" stroke="#C0392B" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="1297.1" y="619" width="25.7" height="19" rx="4" fill="#F4F2EC"/><text x="1310" y="633" font-family="JetBrains Mono" font-size="11.5" fill="#C0392B" text-anchor="middle">no</text><rect x="940" y="600" width="236" height="90" rx="10" fill="#FBEBE8" stroke="#C0392B" stroke-width="1.8"/><text x="1058" y="632.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Learn from it</text><text x="1058" y="652.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">label stored, rule gets stricter</text><text x="1058" y="669.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">for that room</text><path d="M940,525 H700 V700" stroke="#8A958E" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="560" y="700" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#2F7549" stroke-width="1.8"/><text x="700" y="735.5" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Estate officer sees the day</text><text x="700" y="755.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Savings page, monthly PDF for the</text><text x="700" y="772.5" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">principal</text><path d="M418,410 V520 H318" stroke="#8A958E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="362.9" y="457" width="74.1" height="19" rx="4" fill="#F4F2EC"/><text x="400" y="471" font-family="JetBrains Mono" font-size="11.5" fill="#34463E" text-anchor="middle">room busy</text><rect x="64" y="480" width="250" height="80" rx="8" fill="#ECEEE8" stroke="#C9CFC7" stroke-width="1.8"/><text x="189" y="516" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#34463E" text-anchor="middle">No alert</text><text x="189" y="536" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">people inside, power is expected</text><rect x="64" y="850" width="1472" height="90" rx="12" fill="#FFFFFF" stroke="#DEE2DA" stroke-width="1.5"/><text x="88" y="884" font-family="IBM Plex Sans" font-size="15" fill="#34463E">Design choices: one alert names one room and one action. The rupee cost is worked out by code, the words are only phrased by the language model. Every alert asks one question</text><text x="88" y="905.7" font-family="IBM Plex Sans" font-size="15" fill="#34463E">back, so the block builds its own labelled data.</text></svg>