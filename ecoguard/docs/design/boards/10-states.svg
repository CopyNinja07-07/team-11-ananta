<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66756D"/></marker></defs><rect width="1600" height="1000" fill="#F4F2EC"/><text x="64" y="72" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#2F7549" letter-spacing="2">STATES AND ACCESSIBILITY</text><text x="64" y="116" font-family="Space Grotesk" font-size="36" font-weight="600" fill="#10231C">Every screen handles these states</text><text x="1536" y="72" font-family="JetBrains Mono" font-size="12" fill="#8A958E" text-anchor="end" letter-spacing="1.5">ECOGUARD · ROUND 2 UI/UX</text><rect x="64" y="180" width="470" height="130" rx="8" fill="#ECEEE8" stroke="#C9CFC7" stroke-width="1.8"/><text x="299" y="241" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#34463E" text-anchor="middle">Loading</text><text x="299" y="261" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Loading the building…</text><text x="68" y="342" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">Spinner with words, read out by screen readers.</text><rect x="560" y="180" width="470" height="130" rx="8" fill="#ECEEE8" stroke="#C9CFC7" stroke-width="1.8"/><text x="795" y="241" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#34463E" text-anchor="middle">No readings yet</text><text x="795" y="261" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Start the sensor gateway or connect the ESP32 nodes.</text><text x="564" y="342" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">First-run state, tells the user the next step.</text><rect x="1056" y="180" width="470" height="130" rx="14" fill="#EEF5EE" stroke="#2F7549" stroke-width="1.8"/><text x="1291" y="241" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Nothing wasted</text><text x="1291" y="261" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Every room, the tank and the pump are checked every 15 minutes.</text><text x="1060" y="342" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">An empty list is good news, said plainly.</text><rect x="64" y="440" width="470" height="130" rx="10" fill="#FBEBE8" stroke="#C0392B" stroke-width="1.8"/><text x="299" y="501" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Server offline</text><text x="299" y="521" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Could not reach the ECOGUARD server. Retry.</text><text x="68" y="602" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">Keeps the last data on screen, marks it stale.</text><rect x="560" y="440" width="470" height="130" rx="10" fill="#FBEBE8" stroke="#C0392B" stroke-width="1.8"/><text x="795" y="501" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#10231C" text-anchor="middle">Power cut</text><text x="795" y="521" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Grid off. Loads that come back on are watched.</text><text x="564" y="602" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">Header chip turns red; comeback waste is tracked.</text><rect x="1056" y="440" width="470" height="130" rx="8" fill="#ECEEE8" stroke="#C9CFC7" stroke-width="1.8"/><text x="1291" y="501" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#34463E" text-anchor="middle">No 3D support</text><text x="1291" y="521" font-family="IBM Plex Sans" font-size="12.5" fill="#66756D" text-anchor="middle">Falls back to the floor plan.</text><text x="1060" y="602" font-family="IBM Plex Sans" font-size="14.5" fill="#34463E">Same rooms and colours, works on old phones.</text><rect x="64" y="720" width="1472" height="220" rx="16" fill="#0F2A20"/><text x="96" y="764" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#8EC29F" letter-spacing="1.5">ACCESSIBILITY</text><rect x="96" y="800" width="8" height="8" rx="4" fill="#8EC29F"/><text x="116" y="810" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF">Skip link, landmarks and one h1 per page</text><rect x="816" y="800" width="8" height="8" rx="4" fill="#8EC29F"/><text x="836" y="810" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF">Keyboard reaches every room in the 3D view through a list</text><rect x="96" y="842" width="8" height="8" rx="4" fill="#8EC29F"/><text x="116" y="852" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF">Reduced motion stops the flowing particles</text><rect x="816" y="842" width="8" height="8" rx="4" fill="#8EC29F"/><text x="836" y="852" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF">Hindi advice and voice read-out for the caretaker</text><rect x="96" y="884" width="8" height="8" rx="4" fill="#8EC29F"/><text x="116" y="894" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF">Status never by colour alone: always a word too</text><rect x="816" y="884" width="8" height="8" rx="4" fill="#8EC29F"/><text x="836" y="894" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF">Touch targets 44 px on phone</text></svg>